<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chiquiteca 2000milera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#b9c9e8;font-family:Tahoma,Verdana,Geneva,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#0b5fa5;text-decoration:underline}
a:hover{color:#ff2e88}
button{font:inherit}
@keyframes fl1{0%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(14px,-22px) rotate(8deg)}100%{transform:translate(0,0) rotate(0deg)}}
@keyframes fl2{0%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(-18px,16px) rotate(-10deg)}100%{transform:translate(0,0) rotate(0deg)}}
@keyframes fl3{0%{transform:translate(0,0)}50%{transform:translate(9px,26px)}100%{transform:translate(0,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.6) rotate(0deg)}50%{opacity:1;transform:scale(1.25) rotate(45deg)}}
@keyframes flutter{0%,100%{transform:translate(0,0) rotate(-6deg) scaleX(1)}25%{transform:translate(20px,-14px) rotate(6deg) scaleX(.6)}50%{transform:translate(40px,4px) rotate(-4deg) scaleX(1)}75%{transform:translate(18px,18px) rotate(8deg) scaleX(.7)}}
@keyframes shine{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes hb{0%,100%{transform:scale(1)}14%{transform:scale(1.06)}28%{transform:scale(1)}42%{transform:scale(1.04)}}
@keyframes mq{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes popin{0%{transform:scale(.9) translateY(10px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes buzz{0%,100%{transform:translate(0,0)}10%{transform:translate(-3px,2px)}20%{transform:translate(3px,-2px)}30%{transform:translate(-2px,-2px)}40%{transform:translate(2px,3px)}50%{transform:translate(0,0)}}
@keyframes rgbcyc{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
@keyframes slidein{0%{transform:translateX(-120%) rotate(-12deg)}100%{transform:translateX(0) rotate(-4deg)}}

.screen{display:none;animation:popin .35s ease-out}
.screen.active{display:block}

.tabbtn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:5px 2px;border-radius:5px;border:1px solid #ffffff44;background:linear-gradient(180deg,#6fb8e6,#2f7fc4);box-shadow:0 2px 4px rgba(0,0,0,.25)}
.tabbtn .ico,.tabbtn .lbl{color:#eaf6ff}
.tabbtn.active{border-color:#ffffff;background:linear-gradient(180deg,#ffffff,#dbeeff);box-shadow:inset 0 2px 5px rgba(40,90,150,.35)}
.tabbtn.active .ico,.tabbtn.active .lbl{color:#12324f}
.tabbtn .ico{font-size:15px;line-height:1}
.tabbtn .lbl{font-family:Silkscreen,monospace;font-size:7px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

.partybtn{flex:1;font-family:Tahoma,sans-serif;font-size:13px;font-weight:700;padding:10px 0;border-radius:8px;cursor:pointer;border:2px solid #c9d8ea;background:linear-gradient(180deg,#ffffff,#eef4fb);color:#4a5a70}
.partybtn.active{border-color:#d86bb5;background:linear-gradient(180deg,#ffd9ef,#f0a8d8);color:#6b1f52}

.moodtile{border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.9);box-shadow:0 3px 9px rgba(120,90,180,.22);aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:flex-end;padding:9px;transition:transform .15s}
.moodtile:hover{transform:scale(1.03) rotate(-1deg)}
.moodtile span{font-family:Silkscreen,monospace;font-size:9px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);line-height:1.5}

.brick{aspect-ratio:2/1;border-radius:2px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.15)}
.pinlink{transition:transform .15s,box-shadow .15s}
.pinlink:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(200,40,80,.3)}
.wabtn:hover{transform:translateY(-2px)}
.addbrick{transition:transform .1s}
.addbrick:hover{transform:translateY(-1px)}
.addbrick:active{transform:translateY(1px)}
</style>
</head>
<body>

<div style="min-height:100vh;position:relative;overflow:hidden;background:

    <svg viewBox="0 0 60 44" style="position:absolute;top:33%;left:3%;width:38px;animation:flutter 16s ease-in-out infinite reverse;filter:drop-shadow(0 3px 5px rgba(120,90,180,.3))">
      <path d="M30 22C24 6 12 2 6 8c-6 6 2 18 24 14z" fill="#ffc0e6" opacity=".9"/>
      <path d="M30 22C36 6 48 2 54 8c6 6-2 18-24 14z" fill="#c9b6f7" opacity=".9"/>
      <rect x="29" y="14" width="2" height="18" rx="1" fill="#7a5bb5"/>
    </svg>
    <div style="position:absolute;top:14%;right:22%;width:22px;height:22px;background:radial-gradient(circle,#fff 0%,#ffe9fb 40%,rgba(255,255,255,0) 70%);animation:twinkle 3.2s ease-in-out infinite"></div>
    <div style="position:absolute;top:52%;left:12%;width:16px;height:16px;background:radial-gradient(circle,#fff 0%,#e6f4ff 45%,rgba(255,255,255,0) 70%);animation:twinkle 2.4s ease-in-out infinite .6s"></div>
    <div style="position:absolute;bottom:28%;right:26%;width:26px;height:26px;background:radial-gradient(circle,#fff 0%,#f4e9ff 42%,rgba(255,255,255,0) 72%);animation:twinkle 4s ease-in-out infinite 1.1s"></div>
    <div style="position:absolute;top:74%;left:20%;width:14px;height:14px;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%);animation:twinkle 2.8s ease-in-out infinite .3s"></div>
    <div style="position:absolute;top:8%;left:34%;width:10px;height:10px;background:#fff;box-shadow:6px 0 0 #fff,-6px 0 0 #fff,0 6px 0 #fff,0 -6px 0 #fff;animation:twinkle 3.6s steps(2) infinite"></div>
    <div style="position:absolute;bottom:9%;right:12%;width:8px;height:8px;background:#fff;box-shadow:5px 0 0 #fff,-5px 0 0 #fff,0 5px 0 #fff,0 -5px 0 #fff;animation:twinkle 2.2s steps(2) infinite .9s"></div>
    <div style="position:absolute;top:38%;left:8%;width:26px;height:52px;border-radius:9px;background:linear-gradient(150deg,#d9c9ff,#9f88d8);border:1px solid rgba(255,255,255,.7);box-shadow:0 4px 10px rgba(120,90,180,.35);animation:fl2 14s ease-in-out infinite;padding:4px">
      <div style="width:100%;height:16px;border-radius:3px;background:linear-gradient(#8fdcc0,#5fbf9d)"></div>
