    // document mints the blobs for its OWN frames, obtaining page text

    // its direct parent (which, for every document the publisher's own

      // and sender identity (own child frame / direct parent) is checked

    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>

    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

        const m = MARKER.exec(el.getAttribute('src') || '');

        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.

        const pre = resourceBlobs[s.src.split('#')[0]];

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

eight:700;color:#4a1f45;line-height:1.2\">lo que su corazón quiera<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isRsvp }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"animation:popin .35s ease-out\">\n              <div style=\"font-family:Bungee,Tahoma,sans-serif;font-size:20px;line-height:1.1;color:#6b3bb5;margin-bottom:4px\">CONFIRMA POR INBOX<\u002Fdiv>\n              <p style=\"margin:0 0 14px;font-size:13px;line-height:1.6;color:#3a3255\">Si Ud. Está viendo esta imagen es porque está siendo invitado e invitada e invitade.<\u002Fp>\n\n              <div style=\"background:#fff;border:2px solid #d8c9f0;border-radius:12px;padding:13px\">\n                <label style=\"display:block;font-family:Silkscreen,monospace;font-size:8px;color:#7a5bb5;letter-spacing:1px;margin-bottom:5px\">SU NOMBRE / APODO<\u002Flabel>\n                <input value=\"{{ name }}\" sc-camel-on-change=\"{{ onName }}\" placeholder=\"ej. Jas la popstar\" style=\"width:100%;font-family:Tahoma,sans-serif;font-size:14px;padding:10px;border:2px solid #b9d4f2;border-radius:8px;background:#f8fbff;color:#22303f;box-shadow:inset 0 1px 4px rgba(120,150,190,.2)\">\n\n                <label style=\"display:block;font-family:Silkscreen,monospace;font-size:8px;color:#7a5bb5;letter-spacing:1px;margin:12px 0 5px\">CON CUÁNTA GENTE CAE<\u002Flabel>\n                <div style=\"display:flex;gap:6px\">\n                  <sc-for list=\"{{ partyOptions }}\" as=\"opt\" hint-placeholder-count=\"4\">\n                    <button sc-camel-on-click=\"{{ opt.pick }}\" style=\"flex:1;font-family:Tahoma,sans-serif;font-size:13px;font-weight:700;padding:10px 0;border-radius:8px;cursor:pointer;border:2px solid {{ opt.border }};background:{{ opt.bg }};color:{{ opt.color }}\">{{ opt.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n\n                <label style=\"display:block;font-family:Silkscreen,monospace;font-size:8px;color:#7a5bb5;letter-spacing:1px;margin:12px 0 5px\">SU OUTFIT / MENSAJITO (OPCIONAL)<\u002Flabel>\n                <textarea value=\"{{ note }}\" sc-camel-on-change=\"{{ onNote }}\" rows=\"2\" placeholder=\"voy de grilla 2000 con brillantina\" style=\"width:100%;font-family:Tahoma,sans-serif;font-size:13px;padding:10px;border:2px solid #b9d4f2;border-radius:8px;background:#f8fbff;color:#22303f;resize:vertical;box-shadow:inset 0 1px 4px rgba(120,150,190,.2)\"><\u002Ftextarea>\n\n                <a href=\"{{ waLink }}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;justify-content:center;gap:8px;margin-top:13px;text-decoration:none;background:linear-gradient(180deg,#5df08a,#25a544);color:#04240f;font-weight:700;font-size:15px;padding:13px;border-radius:999px;border:1px solid #ffffff88;box-shadow:0 5px 14px rgba(37,165,68,.4)\" style-hover=\"transform:translateY(-2px)\">\n                  <svg sc-camel-view-box=\"0 0 24 24\" style=\"width:19px;flex:none\" fill=\"#04240f\"><path d=\"M12 2a10 10 0 0 0-8.7 15L2 22l5.2-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-1.7-.1-1.2-.4-3-1.5-4.3-3.3-1-1.3-1.4-2.4-1.5-3 0-.6.2-1.2.6-1.6.2-.2.4-.3.6-.3h.5c.2 0 .4 0 .5.4l.7 1.7c.1.2 0 .4-.1.5l-.4.5c-.1.1-.2.3-.1.5.2.4.7 1.1 1.3 1.6.7.6 1.3.9 1.6 1 .2.1.4 0 .5-.1l.6-.6c.2-.2.3-.2.5-.1l1.6.8c.3.2.4.3.4.5s0 .3-.1.5z\"><\u002Fpath><\u002Fsvg>\n                  Enviar por WhatsApp\n                <\u002Fa>\n                <p style=\"margin:9px 0 0;font-size:11px;color:#7a7095;line-height:1.5\">{{ waHint }}<\u002Fp>\n              <\u002Fdiv>\n\n              <div style=\"margin-top:12px;background:linear-gradient(90deg,#ffd9ef,#e6dcff,#d6f5e3);border:1px solid #cbb8ee;border-radius:10px;padding:11px 12px;font-family:Bungee,Tahoma,sans-serif;font-size:14px;color:#6b3bb5;text-align:center;animation:rgbcyc 12s linear infinite\">Caiga con quien quiera!<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"text-align:center;font-family:Silkscreen,monospace;font-size:8px;color:#7a6ba8;letter-spacing:1px;margin:12px 0 0;opacity:.75\">CHIQUITECA 2000MILERA · EDICIÓN 2000'S · V2K<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:fixed;bottom:0;left:0;right:0;z-index:20;background:linear-gradient(180deg,#4a9fdc 0%,#2b7cbe 12%,#1f6aa8 88%,#398fd0 100%);border-top:2px solid #7fc4ec;box-shadow:0 -3px 12px rgba(20,60,110,.4)\">\n    <div style=\"max-width:452px;margin:0 auto;display:flex;align-items:stretch;gap:4px;padding:5px 6px\">\n      <div style=\"display:flex;align-items:center;gap:5px;padding:0 10px 0 7px;border-radius:6px;background:linear-gradient(180deg,#7ee38f,#2e9c3f 55%,#1e7a2e);border:1px solid #ffffff66;box-shadow:0 2px 5px rgba(0,0,0,.3);flex:none\">\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:1.5px;width:13px\">\n          <div style=\"aspect-ratio:1;background:#ff6b6b;border-radius:1px\"><\u002Fdiv><div style=\"aspect-ratio:1;background:#7ec8f5;border-radius:1px\"><\u002Fdiv>\n          <div style=\"aspect-ratio:1;background:#ffe066;border-radius:1px\"><\u002Fdiv><div style=\"aspect-ratio:1;background:#8ff0a4;border-radius:1px\"><\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);font-style:italic\">Start<\u002Fspan>\n      <\u002Fdiv>\n      <sc-for list=\"{{ tabs }}\" as=\"tab\" hint-placeholder-count=\"5\">\n        <button sc-camel-on-click=\"{{ tab.go }}\" title=\"{{ tab.title }}\" style=\"flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:5px 2px;border-radius:5px;border:1px solid {{ tab.border }};background:{{ tab.bg }};box-shadow:{{ tab.shadow }}\">\n          <span style=\"font-size:15px;line-height:1;color:{{ tab.color }}\">{{ tab.icon }}<\u002Fspan>\n          <span style=\"font-family:Silkscreen,monospace;font-size:7px;letter-spacing:.3px;color:{{ tab.color }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%\">{{ tab.label }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:452,&quot;height&quot;:900},&quot;whatsappNumber&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;3108222613&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Datos&quot;},&quot;pinterestUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://co.pinterest.com/?tabId=695735911125366799&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Datos&quot;},&quot;spotifyPlaylistId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;5gtNWA3phSkzLL5iEBDoXE&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Datos&quot;},&quot;direccion&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;CRA 68 #95-33, Barrio Castilla, Medellín, Colombia&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Datos&quot;}}\">\nclass Component extends DCLogic {\n  state = { screen: 'invite', bricks: 24, name: '', note: '', party: '+1' };\n\n  renderVals() {\n    const p = this.props;\n    const screen = this.state.screen;\n    const go = (s) => () => this.setState({ screen: s });\n    const titles = {\n      invite: 'Jas — Conversación',\n      outfit: 'Concurso de outfits — Pinterest',\n      music: 'PERREO A POCA LUZ — Winamp',\n      map: 'Cómo llegar — Castilla',\n      fund: 'Fondo de ladrillitos.xls',\n      rsvp: 'Confirmar asistencia'\n    };\n    const defs = [\n      ['invite', '✉', 'INVITA', 'La invitación'],\n      ['outfit', 'P', 'OUTFIT', 'Pinterest de outfits'],\n      ['music', '◉', 'MUSICA', 'Playlist de Spotify'],\n      ['map', '⌖', 'MAPA', 'Cómo llegar'],\n      ['fund', '▦', 'FONDO', 'Fondo de reconstrucción'],\n      ['rsvp', '✓', 'CAIGO', 'Confirmar por WhatsApp']\n    ];\n    const tabs = defs.map(([id, icon, label, title]) => {\n      const on = screen === id;\n      return {\n        go: go(id), icon, label, title,\n        bg: on ? 'linear-gradient(180deg,#ffffff,#dbeeff)' : 'linear-gradient(180deg,#6fb8e6,#2f7fc4)',\n        border: on ? '#ffffff' : '#ffffff44',\n        color: on ? '#12324f' : '#eaf6ff',\n        shadow: on ? 'inset 0 2px 5px rgba(40,90,150,.35)' : '0 2px 4px rgba(0,0,0,.25)'\n      };\n    });\n\n    const moodBgs = [\n      ['linear-gradient(150deg,#ff9ad5,#a45bff)', 'TOP DE BRILLANTINA'],\n      ['linear-gradient(150deg,#a8e6ff,#2f7fc4)', 'JEAN TIRO BAJO'],\n      ['linear-gradient(150deg,#c6ffd6,#25a544)', 'CHANDOSA + TACÓN'],\n      ['linear-gradient(150deg,#fff3a8,#ff9f43)', 'GAFAS DE MOSCA'],\n      ['linear-gradient(150deg,#e6dcff,#7a5bb5)', 'MOÑO CON GEL'],\n      ['linear-gradient(150deg,#ffd9ef,#e8305f)', 'CINTURÓN ANCHO'],\n      ['linear-gradient(150deg,#d6f5e3,#1f9c8a)', 'TENIS BLANCOS'],\n      ['linear-gradient(150deg,#cfe2fb,#8b5ad8)', 'CELULAR CON DIJE']\n    ];\n\n    const bricks = [];\n    const brickPalette = ['linear-gradient(180deg,#e0a878,#c98a58)', 'linear-gradient(180deg,#d89a6a,#b87848)', 'linear-gradient(180deg,#e8b88a,#d09a68)'];\n    for (let i = 0; i < 32; i++) {\n      bricks.push({ bg: i < Math.min(32, this.state.bricks) ? brickPalette[i % 3] : 'repeating-linear-gradient(45deg,#f2ece2,#f2ece2 3px,#e6ddd0 3px,#e6ddd0 6px)' });\n    }\n\n    const num = (p.whatsappNumber || '3108222613').replace(/[^0-9]/g, '');\n    const partyOptions = ['solo/a', '+1', '+2', 'parche'].map((label) => {\n      const on = this.state.party === label;\n      return {\n        label, pick: () => this.setState({ party: label }),\n        bg: on ? 'linear-gradient(180deg,#ffd9ef,#f0a8d8)' : 'linear-gradient(180deg,#ffffff,#eef4fb)',\n        border: on ? '#d86bb5' : '#c9d8ea',\n        color: on ? '#6b1f52' : '#4a5a70'\n      };\n    });\n    const msg = 'Amix! Confirmo que caigo a la chiquiteca 2000milera.\\n' +\n      'Nombre: ' + (this.state.name || '(sin nombre)') + '\\n' +\n      'Voy: ' + this.state.party + '\\n' +\n      (this.state.note ? 'Outfit/mensaje: ' + this.state.note + '\\n' : '') +\n      'Sábado 12 de septiembre, 8:37pm — Castilla, CRA 68 #95-33';\n    const waLink = num\n      ? 'https://wa.me/' + num + '?text=' + encodeURIComponent(msg)\n      : 'https://wa.me/?text=' + encodeURIComponent(msg);\n\n    const addr = p.direccion ?? 'CRA 68 #95-33, Barrio Castilla, Medellín, Colombia';\n    const playlist = p.spotifyPlaylistId ?? '5gtNWA3phSkzLL5iEBDoXE';\n\n    return {\n      titleBar: titles[screen],\n      isInvite: screen === 'invite',\n      isOutfit: screen === 'outfit',\n      isMusic: screen === 'music',\n      isMap: screen === 'map',\n      isFund: screen === 'fund',\n      isRsvp: screen === 'rsvp',\n      tabs,\n      moodTiles: moodBgs.map(([bg, label]) => ({ bg, label })),\n      bricks,\n      brickCount: this.state.bricks,\n      addBrick: () => this.setState((s) => ({ bricks: s.bricks + 1 })),\n      pinterestUrl: p.pinterestUrl ?? 'https://co.pinterest.com/?tabId=695735911125366799',\n      spotifyEmbed: 'https://open.spotify.com/embed/playlist/' + playlist + '?utm_source=generator&theme=0',\n      spotifyOpen: 'https://open.spotify.com/playlist/' + playlist,\n      mapEmbed: 'https://maps.google.com/maps?q=' + encodeURIComponent(addr) + '&z=16&output=embed',\n      mapLink: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(addr),\n      name: this.state.name,\n      note: this.state.note,\n      onName: (e) => this.setState({ name: e.target.value }),\n      onNote: (e) => this.setState({ note: e.target.value }),\n      partyOptions,\n      waLink,\n      waHint: num\n        ? 'Abre WhatsApp con el mensaje listo. Solo dale enviar.'\n        : 'Falta el número de WhatsApp: se abre WhatsApp para que elija el chat. Pásame el número y lo dejo fijo.'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
